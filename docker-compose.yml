# Local stack: Postgres + Pulse API run from repo root (`go run ./apps/api/cmd/api`).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 3s
      timeout: 3s
      retries: 10
