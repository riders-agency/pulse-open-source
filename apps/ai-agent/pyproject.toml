[project]
name = "pulse-ai-agent"
version = "0.1.0"
description = "Riders Pulse project AI employee LangGraph runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.76.0",
  "grpcio-health-checking>=1.76.0",
  "grpcio-tools>=1.76.0",
  "langchain-core>=1.2.0",
  "langgraph>=1.0.4",
  "langgraph-checkpoint-postgres>=3.0.2",
  "opentelemetry-api>=1.39.0",
  "opentelemetry-instrumentation-grpc>=0.60b0",
  "opentelemetry-sdk>=1.39.0",
  "pydantic>=2.12.0",
  "structlog>=25.5.0",
]

[dependency-groups]
dev = [
  "mypy>=1.19.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.0",
]

[project.scripts]
pulse-ai-agent = "pulse_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse_agent"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["src/pulse_agent/proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["src/pulse_agent/proto", "src/pulse_agent/tests"]
ignore_missing_imports = true
disallow_any_generics = false
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["pulse_agent.grpc_server", "pulse_agent.graph.builder"]
disable_error_code = ["misc", "type-var", "import-not-found", "import-untyped"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/pulse_agent/tests"]
