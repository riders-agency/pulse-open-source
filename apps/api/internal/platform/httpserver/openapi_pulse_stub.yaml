      type: object
      additionalProperties: false
      properties:
        amount:
          type: number
          format: double
        source:
          type: string
          default: manual
          enum:
            - manual
            - api_key
            - bank
            - workflow
            - email
            - incoming_email
            - kontur_elba
            - integration
            - other_integration
        payment_method:
          type: string
          description: How the client actually paid. This is distinct from source, which says how Pulse learned about the payment.
          enum:
            - cash
            - legal_invoice
            - bank_transfer
            - card
            - other
        paid_at:
          type: string
          format: date-time
        next_due_date:
          type: string
          format: date
          description: Optional explicit next payment date for all services in this payment action after the payment is recorded.
        comment:
          type: string
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              payment_action_item_id:
                type: string
                format: uuid
              amount:
                type: number
                format: double
