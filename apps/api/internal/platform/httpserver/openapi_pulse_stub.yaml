        session_id:
          type: string
          format: uuid
          example: 9d660b52-2e4e-4b0c-8ab0-ce0df8a3e550
        client_type:
          type: string
          example: web
        device_label:
          type: string
          example: Chrome on macOS
        ip_address:
          type: string
          example: 203.0.113.10
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        is_current:
          type: boolean
          example: true
