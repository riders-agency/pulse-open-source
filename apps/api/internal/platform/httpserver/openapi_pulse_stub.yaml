          enum:
            - cash
            - legal_invoice
            - bank_transfer
            - card
            - other
        next_due_date:
          type: string
          format: date
          description: Optional explicit next payment date for the selected service after the payment is recorded.
        comment:
          type: string
        idempotency_key:
          type: string
