          type: string
          minLength: 1
          maxLength: 240
        tax_id:
          type: string
          maxLength: 32
        purpose:
          type: string
          minLength: 1
          maxLength: 1000
        due_date:
          type: string
          description: YYYY-MM-DD or empty string
          pattern: ^(\d{4}-\d{2}-\d{2})?$
        payment_action_id:
          type: string
          format: uuid
        amount_minor:
          type: string
          pattern: ^[1-9][0-9]*$
