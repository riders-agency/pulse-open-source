            - needs_decision
        source:
          type: string
          enum:
            - manual
            - api_key
            - bank
            - workflow
            - email
            - incoming_email
            - kontur_elba
            - integration
            - other_integration
        payment_method:
          type: string
          enum:
            - cash
            - legal_invoice
            - bank_transfer
            - card
            - other
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        due_date:
          type: string
          format: date
        total_amount:
          type: number
          format: double
        currency:
          type: string
          example: RUB
