    get:
      tags:
        - ingest
      operationId: ingestWebhookRunReceiptGet
      summary: Получить безопасную квитанцию выполнения webhook-сценария
      description: Возвращает только состояние workflow и статусы его действий. Входной payload, адресаты, тексты сообщений и ответы провайдеров не выдаются. Run обязан принадлежать указанному endpoint. Endpoint с auth_type=none не может использовать этот метод.
      parameters:
        - name: hook_key
          in: path
          required: true
          schema:
            type: string
        - name: endpoint_key
          in: path
          required: true
          schema:
            type: string
        - name: workflow_run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Project-Secret
          in: header
          required: true
          schema:
            type: string
            format: password
        - name: X-Riders-Timestamp
          in: header
          required: true
          schema:
            type: string
            format: date-time
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Текущая либо терминальная квитанция
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookRunReceipt'
        '400':
          description: Некорректный workflow_run_id
        '401':
          description: Ошибка авторизации или freshness-проверки
        '404':
          description: Endpoint или принадлежащий ему run не найден
