# Air (https://github.com/air-verse/air) — hot reload для Pulse API.
# Запуск из каталога apps/api: `air` или из корня репы: `pnpm dev` / `bash scripts/dev.sh`

root = "."
tmp_dir = "tmp"

env_files = [".env.local", ".env"]

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "tmp/api"
  entrypoint = ["./tmp/api"]
  exclude_dir = ["tmp", "vendor"]
  exclude_regex = ["_test\\.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  delay = 200
  stop_on_error = true
  kill_delay = 500

[log]
  time = true

[misc]
  clean_on_exit = true
