paths:
  /api/v1/payment-actions/{payment_action_id}/bank-invoice:
    get:
      tags:
      - clients
      summary: Read bank invoice preparation
      operationId: bankInvoiceRead
      security:
      - bearerAuth: []
      parameters:
      - &id001
        name: payment_action_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Invoice preparation; no bank operation occurs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankInvoiceWorkspace'
        '401':
          description: Authentication required
        '403':
          description: Insufficient project or finance access
        '500':
          description: Internal error
    put:
      tags:
      - clients
      summary: Save bank-neutral invoice draft
      operationId: bankInvoiceSave
      security:
      - bearerAuth: []
      parameters:
      - *id001
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Invoice preparation; no bank operation occurs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankInvoiceDraft'
        '401':
          description: Authentication required
        '403':
          description: Insufficient project or finance access
        '500':
          description: Internal error
        '400':
          description: Invalid input or missing idempotency key
        '409':
          description: Stale revision, conflicting key, or closed payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankInvoiceInput'
components:
  schemas:
    BankInvoiceInput:
      type: object
      additionalProperties: false
      required:
      - revision
      - kind
      - payer_name
      - tax_id
      - purpose
      - due_date
      properties:
        revision: &id002
          type: integer
          minimum: 0
          maximum: 2147483646
        kind: &id003
          type: string
          enum:
          - bank_invoice
          - payment_link
        payer_name: &id004
          type: string
          minLength: 1
          maxLength: 240
        tax_id: &id005
          type: string
          maxLength: 32
        purpose: &id006
          type: string
          minLength: 1
          maxLength: 1000
        due_date: &id007
          type: string
          description: YYYY-MM-DD or empty string
          pattern: ^(\d{4}-\d{2}-\d{2})?$
    BankInvoiceDraft:
      type: object
      required:
      - revision
      - kind
      - payer_name
      - tax_id
      - purpose
      - due_date
      - payment_action_id
      - amount_minor
      - currency
      - status
      - updated_at
      properties:
        revision: *id002
        kind: *id003
        payer_name: *id004
        tax_id: *id005
        purpose: *id006
        due_date: *id007
        payment_action_id:
          type: string
          format: uuid
        amount_minor:
          type: string
          pattern: ^[1-9][0-9]*$
        currency:
          type: string
          enum:
          - RUB
        status:
          type: string
          enum:
          - draft
        updated_at:
          type: string
          format: date-time
    BankInvoiceWorkspace:
      type: object
      required:
      - draft
      - amount_minor
      - currency
      - payment_status
      - payer_name
      - providers
      - can_edit
      properties:
        draft:
          oneOf:
          - $ref: '#/components/schemas/BankInvoiceDraft'
          - type: 'null'
        amount_minor:
          type: string
          pattern: ^-?[0-9]+$
        currency:
          type: string
        payment_status:
          type: string
        payer_name:
          type: string
        providers:
          type: array
          description: Installed adapters, not bank account connections; empty until
            a verified adapter is installed.
          items:
            type: object
            required:
            - key
            - name
            - bank_invoice
            - payment_link
            properties:
              key:
                type: string
              name:
                type: string
              bank_invoice:
                type: boolean
              payment_link:
                type: boolean
        can_edit:
          type: boolean
