paths:
  /hooks/{hook_key}/{endpoint_key}/runs/{workflow_run_id}/receipt:
    get:
      tags: [ingest]
      operationId: ingestWebhookRunReceiptGet
      summary: Получить безопасную квитанцию выполнения webhook-сценария
      description: >-
        Возвращает только состояние workflow и статусы его действий. Входной
        payload, адресаты, тексты сообщений и ответы провайдеров не выдаются.
        Run обязан принадлежать указанному endpoint. Endpoint с auth_type=none
        не может использовать этот метод.
      parameters:
        - name: hook_key
          in: path
          required: true
          schema: {type: string}
        - name: endpoint_key
          in: path
          required: true
          schema: {type: string}
        - name: workflow_run_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-Project-Secret
          in: header
          required: true
          schema: {type: string, format: password}
        - name: X-Riders-Timestamp
          in: header
          required: true
          schema: {type: string, format: date-time}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, maxLength: 200}
      responses:
        '200':
          description: Текущая либо терминальная квитанция
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookRunReceipt'
        '400': {description: Некорректный workflow_run_id}
        '401': {description: Ошибка авторизации или freshness-проверки}
        '404': {description: Endpoint или принадлежащий ему run не найден}

components:
  schemas:
    WebhookRunReceipt:
      type: object
      additionalProperties: false
      required: [workflow_run_id, status, terminal, actions]
      properties:
        workflow_run_id: {type: string, format: uuid}
        status:
          type: string
          enum: [pending, running, waiting, succeeded, failed, cancelled]
        terminal: {type: boolean}
        terminal_reason: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        actions:
          type: array
          items:
            $ref: '#/components/schemas/WebhookActionReceipt'
    WebhookActionReceipt:
      type: object
      additionalProperties: false
      required: [action_key, action_type_key, status, attempt_count]
      properties:
        action_key: {type: string}
        action_type_key: {type: string}
        status:
          type: string
          enum: [pending, running, succeeded, failed, skipped, waiting, retrying, dead_lettered]
        attempt_count: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1}
        terminal_reason: {type: string}
        retry_class:
          type: string
          enum: [validation, auth, permanent, transient, rate_limited, timeout_unknown, canceled, unknown_outcome]
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
