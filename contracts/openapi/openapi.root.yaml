  version: 1.1.0
  summary: Modular OpenAPI contract for the generated stack
  description: |
    Source-of-truth API contract.
    Generated bundle is served by docs endpoints.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.example.test
    description: Production
  - url: https://staging-api.example.test
    description: Staging
security: []
tags:
  - name: auth
    summary: Authentication and session lifecycle
    description: Registration, login, session lifecycle, OAuth, native exchange.
  - name: company
    summary: Company context and switching
    description: Company listing, creation, and active company switching.
  - name: clients
    summary: Clients, services and payments
    description: Client workspace, client services, payment actions and idempotent payment events.
  - name: docs
    summary: API documentation and testing assets
    description: Bundled OpenAPI artifacts, endpoint catalog, and testing collection metadata.
  - name: catalog
    summary: Конструктор workflow — типы действий и зависимостей
    description: |
      Каталог поддерживаемых типов узлов графа (action_types) и типов секретов/подключений проекта
      (action_dependency_types).
  - name: runs
    summary: Запуски workflow и наблюдение исполнения
    description: |
      Обзор выполнения workflow_run и по шагам — записи исполнений действий (action_runs) и события.
  - name: site_chat
    summary: Чат на сайте, посетители и webvisor-lite
    description: Lightweight widget, visitor/session analytics, monitoring commands and chat conversations.
  - name: ai
    summary: AI-сотрудник проекта и model providers
    description: Project-scoped AI employee, model provider catalog, chat sessions, prompt proposals and model cache.
