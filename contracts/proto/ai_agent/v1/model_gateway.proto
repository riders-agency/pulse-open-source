syntax = "proto3";

package ai_agent.v1;

import "ai_agent/v1/common.proto";
import "google/protobuf/struct.proto";

option go_package = "riders.agency/pulse/api/internal/gen/ai_agent/v1;aiagentv1";

service ModelGatewayService {
  rpc Chat(ModelChatRequest) returns (ModelChatResponse);
  rpc StreamChat(ModelChatRequest) returns (stream ModelChatEvent);
  rpc Embed(EmbedRequest) returns (EmbedResponse);
}

enum ModelPurpose {
  MODEL_PURPOSE_UNSPECIFIED = 0;
  MODEL_PURPOSE_INTENT_ROUTER = 1;
  MODEL_PURPOSE_PLANNER = 2;
  MODEL_PURPOSE_TOOL_ARGS = 3;
  MODEL_PURPOSE_FINAL_RESPONSE = 4;
  MODEL_PURPOSE_MEMORY = 5;
}

message ModelMessage {
  string role = 1;
  string content = 2;
  google.protobuf.Struct metadata_json = 3;
}

message ModelChatRequest {
  string request_id = 1;
  string company_id = 2;
  string project_id = 3;
  string user_id = 4;
  string session_id = 5;
  string thread_id = 6;
  ModelPurpose purpose = 7;
  repeated ModelMessage messages = 8;
  google.protobuf.Struct response_format_json = 9;
  google.protobuf.Struct tool_schemas_json = 10;
  int32 max_tokens = 11;
  double temperature = 12;
  int32 timeout_ms = 13;
  TraceContext trace_context = 14;
}

message ModelChatResponse {
  string content = 1;
  google.protobuf.Struct response_json = 2;
  Usage usage = 3;
}

message ModelChatEvent {
  string delta = 1;
  bool done = 2;
  Usage usage = 3;
  google.protobuf.Struct error = 4;
}

message EmbedRequest {
  string request_id = 1;
  string company_id = 2;
  string project_id = 3;
  string user_id = 4;
  repeated string input = 5;
  TraceContext trace_context = 6;
}

message EmbedResponse {
  repeated google.protobuf.ListValue embeddings = 1;
  Usage usage = 2;
}
